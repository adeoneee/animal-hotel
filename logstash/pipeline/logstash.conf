
input {
  gelf {
    port => 12201
  }
}

filter {
  grok {
    match => {
      "message" => [
        "\[%{DATA:service_name},%{NOTSPACE:traceId},%{NOTSPACE:spanId}\]",
        "TRACE_CHECK traceId=%{NOTSPACE:traceId} spanId=%{NOTSPACE:spanId}"
      ]
    }
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "animal-hotel-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
